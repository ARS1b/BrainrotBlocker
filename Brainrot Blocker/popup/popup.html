<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Blocker</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <button class="back-btn hidden" id="backBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1 class="header-title" id="headerTitle">🧠 Brainrot Blocker</h1>
        </header>

        <!-- Main Menu Page -->
        <div class="page active" id="page-main">
            <!-- Status Card -->
            <div class="status-card">
                <div class="status-indicator" id="statusIndicator">
                    <div class="status-dot"></div>
                    <span class="status-text">Focus Mode: OFF</span>
                </div>
                <button class="focus-toggle-btn" id="focusToggleBtn">
                    Start Focusing
                </button>
            </div>

            <!-- Menu Items -->
            <nav class="menu">
                <button class="menu-item" data-page="blocked-sites">
                    <div class="menu-item-icon">🚫</div>
                    <div class="menu-item-content">
                        <span class="menu-item-title">Blocked Sites</span>
                        <span class="menu-item-desc">Manage websites to block</span>
                    </div>
                    <svg class="menu-item-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>

                <button class="menu-item" data-page="timer">
                    <div class="menu-item-icon">⏱️</div>
                    <div class="menu-item-content">
                        <span class="menu-item-title">Study Timer</span>
                        <span class="menu-item-desc">Pomodoro & focus sessions</span>
                    </div>
                    <svg class="menu-item-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>

                <button class="menu-item" data-page="stats">
                    <div class="menu-item-icon">📊</div>
                    <div class="menu-item-content">
                        <span class="menu-item-title">Statistics</span>
                        <span class="menu-item-desc">View your focus history</span>
                    </div>
                    <svg class="menu-item-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>

                <button class="menu-item" data-page="settings">
                    <div class="menu-item-icon">⚙️</div>
                    <div class="menu-item-content">
                        <span class="menu-item-title">Settings</span>
                        <span class="menu-item-desc">Customize your experience</span>
                    </div>
                    <svg class="menu-item-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </nav>
        </div>

        <!-- Blocked Sites Page -->
        <div class="page" id="page-blocked-sites">
            <div class="page-content">
                <p class="placeholder-text">🚫 Blocked sites management coming soon...</p>
            </div>
        </div>

        <!-- Timer Page -->
        <div class="page" id="page-timer">
            <div class="page-content">
                <p class="placeholder-text">⏱️ Study timer coming soon...</p>
            </div>
        </div>

        <!-- Stats Page -->
        <div class="page" id="page-stats">
            <div class="page-content">
                <p class="placeholder-text">📊 Statistics coming soon...</p>
            </div>
        </div>

        <!-- Settings Page -->
        <div class="page" id="page-settings">
            <div class="page-content">
                <p class="placeholder-text">⚙️ Settings coming soon...</p>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <span>Brainrot Blocker v1.0</span>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
