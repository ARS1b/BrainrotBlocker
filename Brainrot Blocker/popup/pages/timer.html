<div class="timer-page">
  <style>
    .timer-page {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      height: 100%;
    }

    /* Display */
    .t-display {
      text-align: center;
      padding: 24px 0 18px;
      border: 1px solid var(--border, #2a2a32);
      border-radius: 12px;
      background: var(--surface, #16161a);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }
    .t-display.running { border-color: rgba(232,255,71,0.3); }
    .t-display.danger  { border-color: rgba(255,79,79,0.4); }
    .t-display.done    { border-color: #ff4f4f; background: rgba(255,79,79,0.08); }

    .t-display::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 60%; height: 1px;
      background: linear-gradient(90deg, transparent, #e8ff47, transparent);
      opacity: 0; transition: opacity 0.3s;
    }
    .t-display.running::before { opacity: 1; }
    .t-display.danger::before {
      background: linear-gradient(90deg, transparent, #ff4f4f, transparent);
      opacity: 1;
    }

    .t-time {
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 56px;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--text, #f0f0f0);
      transition: color 0.3s;
    }
    .t-display.danger .t-time,
    .t-display.done   .t-time { color: #ff4f4f; }

    .t-sublabel {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted, #5a5a6e);
      margin-top: 6px;
    }

    /* Progress */
    .t-progress-track {
      height: 3px;
      background: var(--border, #2a2a32);
      border-radius: 99px;
      overflow: hidden;
    }
    .t-progress-fill {
      height: 100%;
      background: #e8ff47;
      border-radius: 99px;
      width: 100%;
      transition: width 0.9s linear, background 0.3s;
    }
    .t-progress-fill.danger { background: #ff4f4f; }

    /* Input row */
    .t-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .t-input-wrap {
      flex: 1;
      position: relative;
    }
    .t-input {
      width: 100%;
      padding: 10px 44px 10px 14px;
      background: var(--surface, #16161a);
      border: 1px solid var(--border, #2a2a32);
      border-radius: 8px;
      color: var(--text, #f0f0f0);
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
    }
    .t-input::-webkit-inner-spin-button,
    .t-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .t-input:focus { border-color: #e8ff47; }
    .t-input:disabled { opacity: 0.4; cursor: not-allowed; }
    .t-unit {
      position: absolute;
      right: 12px; top: 50%; transform: translateY(-50%);
      font-size: 10px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted, #5a5a6e);
    }

    /* Buttons */
    .t-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 14px;
      border: none; border-radius: 8px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase;
      cursor: pointer; transition: all 0.15s;
      font-family: inherit;
    }
    .t-btn-start {
      flex: 1;
      background: #e8ff47; color: #0d0d0f;
    }
    .t-btn-start:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .t-btn-start:active { transform: translateY(0); filter: brightness(0.95); }
    .t-btn-start:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }

    .t-btn-reset {
      background: var(--surface, #16161a);
      color: var(--muted, #5a5a6e);
      border: 1px solid var(--border, #2a2a32);
      padding: 10px 12px;
    }
    .t-btn-reset:hover { color: var(--text, #f0f0f0); border-color: var(--muted, #5a5a6e); }

    /* Done banner */
    .t-done-banner {
      display: none;
      align-items: center; justify-content: center;
      padding: 10px;
      background: rgba(255,79,79,0.12);
      border: 1px solid #ff4f4f;
      border-radius: 8px;
      font-size: 12px; font-weight: 700;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: #ff4f4f;
      animation: t-pulse 1s ease-in-out infinite;
    }
    .t-done-banner.visible { display: flex; }
    @keyframes t-pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.55; }
    }
  </style>

  <div class="t-display" id="t-display">
    <div class="t-time" id="t-time">00:00</div>
    <div class="t-sublabel" id="t-sublabel">Aseta aika</div>
  </div>

  <div class="t-progress-track">
    <div class="t-progress-fill" id="t-progress"></div>
  </div>

  <div class="t-input-row">
    <div class="t-input-wrap">
      <input class="t-input" type="number" id="t-minutes" min="1" max="999" placeholder="0" />
      <span class="t-unit">min</span>
    </div>
    <button class="t-btn t-btn-reset" id="t-reset" title="Nollaa">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>
  </div>

  <button class="t-btn t-btn-start" id="t-start">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
    Käynnistä
  </button>

  <div class="t-done-banner" id="t-done">⏰ Aika on loppunut!</div>
</div>
