<!-- Timer Page -->
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8" />
    <title>Ajastin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #16161a;
            --border: #2a2a32;
            --accent: #e8ff47;
            --accent-dim: rgba(232, 255, 71, 0.12);
            --text: #f0f0f0;
            --muted: #5a5a6e;
            --danger: #ff4f4f;
            --danger-dim: rgba(255, 79, 79, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            
            background: var(--bg);
            color: var(--text);
            font-family: 'Syne', sans-serif;
            padding: 24px 20px 20px;
            user-select: none;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            flex-shrink: 0;
        }
        .dot.idle { background: var(--muted); box-shadow: none; }
        .dot.danger { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        h1 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Display */
        .display {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px 0 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .display.running { border-color: rgba(232,255,71,0.3); }
        .display.danger  { border-color: rgba(255,79,79,0.4); }
        .display.done    { border-color: var(--danger); background: var(--danger-dim); }

        .display::before {
            content: '';
            position: absolute;
            top: 0; left: 50%; transform: translateX(-50%);
            width: 60%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .display.running::before { opacity: 1; }
        .display.danger::before {
            background: linear-gradient(90deg, transparent, var(--danger), transparent);
            opacity: 1;
        }

        .time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 52px;
            letter-spacing: 0.04em;
            line-height: 1;
            color: var(--text);
            transition: color 0.3s;
        }
        .display.danger .time { color: var(--danger); }
        .display.done .time   { color: var(--danger); }

        .label {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 6px;
        }

        /* Progress bar */
        .progress-track {
            height: 3px;
            background: var(--border);
            border-radius: 99px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 99px;
            width: 100%;
            transform-origin: left;
            transition: width 0.9s linear, background 0.3s;
        }
        .progress-fill.danger { background: var(--danger); }

        /* Input row */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        .input-wrap {
            flex: 1;
            position: relative;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px 40px 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
        input[type="number"]:focus { border-color: var(--accent); }
        input[type="number"]:disabled { opacity: 0.4; cursor: not-allowed; }
        .unit-label {
            position: absolute;
            right: 12px; top: 50%; transform: translateY(-50%);
            font-size: 10px; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--muted);
        }

        /* Buttons */
        .btn {
            display: flex; align-items: center; justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            border: none; border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-size: 11px; font-weight: 700;
            letter-spacing: 0.14em; text-transform: uppercase;
            cursor: pointer; transition: all 0.15s;
        }
        .btn-start {
            flex: 1;
            background: var(--accent); color: #0d0d0f;
        }
        .btn-start:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-start:active { transform: translateY(0); filter: brightness(0.95); }
        .btn-start:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }

        .btn-reset {
            background: var(--surface); color: var(--muted);
            border: 1px solid var(--border);
            padding: 10px 12px;
        }
        .btn-reset:hover { color: var(--text); border-color: var(--muted); }
        .btn-reset svg { flex-shrink: 0; }

        /* Done banner */
        .done-banner {
            display: none;
            align-items: center; justify-content: center; gap: 8px;
            padding: 10px;
            background: var(--danger-dim);
            border: 1px solid var(--danger);
            border-radius: 8px;
            font-size: 12px; font-weight: 700;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--danger);
            text-align: center;
            animation: pulse 1s ease-in-out infinite;
            margin-top: 12px;
        }
        .done-banner.visible { display: flex; }
            @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="dot idle" id="statusDot"></div>
        <h1>Ajastin</h1>
    </div>

    <div class="display" id="display">
        <div class="time" id="timeDisplay">00:00</div>
        <div class="label" id="displayLabel">Aseta aika</div>
    </div>

    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="input-row">
        <div class="input-wrap">
        <input type="number" id="minutesInput" min="1" max="999" placeholder="0" />
        <span class="unit-label">min</span>
        </div>
        <button class="btn btn-reset" id="resetBtn" title="Nollaa">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
        </svg>
        </button>
    </div>

    <button class="btn btn-start" id="startBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        Käynnistä
    </button>

    <div class="done-banner" id="doneBanner">⏰ Aika on loppunut!</div>

    <script src="timer.js"></script>
    <script src="popup.js"></script>
</body>
</html>
